# Stylite Orbit-ly — production behind Traefik.
#
# Template. Adjust the marked values, put a .env next to it (see
# README → Deployment) and start:
#
#   docker compose -f compose.prod.yml up -d
#
# Migrations run automatically on start: the app has an Ecto.Migrator in its
# supervisor (Orbitly.Application) that, in a release (RELEASE_NAME set), runs
# pending migrations at boot. A separate migrate call is not needed.
#
# Assumptions: an existing Traefik runs and terminates TLS; its Docker network
# is called `proxy` (adjust below). SQLite = single-writer → EXACTLY ONE app
# instance, no scaling/no replicas.

services:
  app:
    image: ghcr.io/styliteag/orbit-ly:${ORBITLY_VERSION:-latest}
    restart: unless-stopped

    environment:
      # --- Required ---
      # SQLite file on the volume (see volumes below).
      DATABASE_PATH: /data/orbitly.db
      # `openssl rand -base64 64 | tr -d '\n'`  (>= 64 characters)
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set in .env}
      # Primary domain = dashboard host, e.g. go.example.com. Synced as the
      # primary domain's hostname at boot; changing it moves the dashboard +
      # all links there to the new domain.
      MAIN_DOMAIN: ${MAIN_DOMAIN:?set the primary domain}
      # SMTP relay used for password-reset emails.
      SMTP_RELAY: ${SMTP_RELAY:?set the SMTP relay hostname}
      MAIL_FROM: ${MAIL_FROM:?set the sender email address}

      # --- Optional (defaults shown) ---
      PORT: "4000"
      POOL_SIZE: "10"
      # Number of trusted reverse proxies in front of the app. Traefik = 1.
      # With a CDN/LB in front as well: increase accordingly (otherwise rate
      # limit & click IP act on the wrong x-forwarded-for entry).
      TRUSTED_PROXY_HOPS: "1"
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Orbit-ly}
      # SMTP credentials. Set both for an authenticated relay (most providers,
      # port 587), leave both unset for an internal relay without AUTH — then
      # usually port 25 and SMTP_TLS=if_available or never.
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      # always (STARTTLS enforced, certificate verified) | if_available | never.
      SMTP_TLS: ${SMTP_TLS:-always}

    volumes:
      # Persistent SQLite DB (incl. -wal/-shm). Do NOT delete.
      - orbitly-data:/data

    networks:
      - proxy

    # Optional healthcheck (BEAM alive). Does not check any HTTP route.
    # healthcheck:
    #   test: ["CMD", "/app/bin/orbitly", "rpc", "IO.puts(:ok)"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # --- HTTPS router: dashboard + ALL redirect domains to the app ---
      # Option 1 (recommended): list concrete hosts. Per-host certificates
      # via ACME/HTTP-01 work automatically. For every new domain in the
      # admin: add it here and `docker compose up -d`.
      - traefik.http.routers.orbitly.rule=Host(`go.example.com`) || Host(`sho.rt`) || Host(`example.link`)
      - traefik.http.routers.orbitly.entrypoints=websecure
      - traefik.http.routers.orbitly.tls=true
      - traefik.http.routers.orbitly.tls.certresolver=le
      - traefik.http.services.orbitly.loadbalancer.server.port=4000

      # Option 2 (catch-all, all hosts → app): REPLACES the rule above.
      # Needs a matching certificate (wildcard via DNS-01 for *.your-domain,
      # or a default cert), because ACME does not issue certs for unknown
      # hosts on-demand. Traefik v3 syntax:
      # - traefik.http.routers.orbitly.rule=HostRegexp(`^.+$`)

      # --- HTTP → HTTPS redirect ---
      - traefik.http.routers.orbitly-http.rule=Host(`go.example.com`) || Host(`sho.rt`) || Host(`example.link`)
      - traefik.http.routers.orbitly-http.entrypoints=web
      - traefik.http.routers.orbitly-http.middlewares=orbitly-https
      - traefik.http.middlewares.orbitly-https.redirectscheme.scheme=https

volumes:
  orbitly-data:

networks:
  # The existing Traefik network. `external: true` = not created here.
  proxy:
    external: true
