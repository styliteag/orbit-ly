name: Release

on:
  push:
    tags:
      - '*.*.*'
  # Manual re-run for an existing tag, for example after fixing missing secrets.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)build, for example 0.1.1"
        required: true

env:
  GHCR_IMAGE: ghcr.io/styliteag/orbit-ly
  DOCKERHUB_IMAGE: docker.io/styliteag/orbit-ly
  # Separate package so the "delete old versions" step never prunes the cache.
  CACHE_IMAGE: ghcr.io/styliteag/orbit-ly-cache

jobs:
  # Build each architecture on a NATIVE runner (no QEMU emulation) and push the
  # resulting image by digest. Compiling the Elixir/Ash dependency tree under
  # emulated arm64 took ~36 min on its own; native arm64 does it in a few minutes.
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          # arm64 disabled: the native `ubuntu-24.04-arm` runner is BILLED per
          # minute on private repos (kostet €). Re-enable if arm64 servers are
          # needed — the merge job already handles multiple digests, so just
          # uncomment. Do NOT add arm64 back to a single amd64 runner without
          # this matrix: that falls back to QEMU emulation (~36 min extra).
          # - platform: linux/arm64
          #   arch: arm64
          #   runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          # Per-arch registry cache in a dedicated package. Survives across runs
          # (no 10 GB GHA-cache limit), so version-only bumps skip mix deps.compile.
          cache-from: type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.CACHE_IMAGE }}:${{ matrix.arch }},mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the per-arch digests into a multi-arch manifest list, tag it, and
  # cut the GitHub Release. Runs once, after both builds finish.
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      # Secrets are not directly addressable in `if:` expressions.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create GHCR manifest list
        working-directory: /tmp/digests
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker buildx imagetools create \
            -t "${GHCR_IMAGE}:${VERSION}" \
            -t "${GHCR_IMAGE}:latest" \
            $(printf "${GHCR_IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}"

      - name: Create Docker Hub manifest list
        if: env.DOCKERHUB_USERNAME != ''
        working-directory: /tmp/digests
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # imagetools copies the per-arch blobs from GHCR into Docker Hub.
          docker buildx imagetools create \
            -t "${DOCKERHUB_IMAGE}:${VERSION}" \
            -t "${DOCKERHUB_IMAGE}:latest" \
            $(printf "${GHCR_IMAGE}@sha256:%s " *)

      - name: Delete old GHCR package versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: "orbit-ly"
          package-type: "container"
          min-versions-to-keep: 5
          delete-only-untagged-versions: false

      - name: Note Docker Hub skipped
        if: env.DOCKERHUB_USERNAME == ''
        run: |
          echo "::notice::DOCKERHUB_USERNAME secret is not set; skipping Docker Hub push."
          echo "::notice::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repo secrets to enable."

      - name: Extract release notes from CHANGELOG
        id: release_notes
        run: |
          python3 << 'EOF' > /tmp/release_notes.md
          import re

          version = "${{ steps.version.outputs.version }}"

          with open("CHANGELOG.md", "r", encoding="utf-8") as f:
              content = f.read()

          version_escaped = re.escape(version)
          pattern = rf"^## \[{version_escaped}\][^\n]*\n(.*?)(?=^## \[|\Z)"

          match = re.search(pattern, content, re.MULTILINE | re.DOTALL)

          if match:
              notes = match.group(0).strip()
              notes = re.sub(rf"^## \[{version_escaped}\][^\n]*\n", "", notes).strip()
              print(notes or f"Release {version}")
          else:
              print(f"Release {version}")
          EOF

          echo "notes<<RELEASE_NOTES_EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/release_notes.md >> "$GITHUB_OUTPUT"
          echo "RELEASE_NOTES_EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          generate_release_notes: false
